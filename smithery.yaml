name: landlaw-ai-mcp
description: "> **By [MEOK AI Labs](https://meok.ai)** \u2014 Sovereign AI tools for\
  \ everyone."
version: 1.0.0
tools:
- name: search_land_registry
  description: Search UK Land Registry by address, title number, or postcode.
  parameters:
  - name: address
    type: string
    required: false
  - name: title_number
    type: string
    required: false
  - name: postcode
    type: string
    required: false
- name: check_planning_permission
  description: Check planning permission requirements for a property modification.
  parameters:
  - name: modification_type
    type: string
    required: true
  - name: property_type
    type: string
    required: false
  - name: listed_building
    type: boolean
    required: false
  - name: conservation_area
    type: boolean
    required: false
  - name: aonb
    type: boolean
    required: false
- name: explain_covenant
  description: Explain a restrictive or positive covenant in plain English.
  parameters:
  - name: covenant_text
    type: string
    required: true
  - name: covenant_type
    type: string
    required: false
- name: calculate_sdlt
  description: Calculate Stamp Duty Land Tax for a UK property purchase.
  parameters:
  - name: purchase_price
    type: number
    required: true
  - name: first_time_buyer
    type: boolean
    required: false
  - name: additional_property
    type: boolean
    required: false
  - name: non_residential
    type: boolean
    required: false
  - name: non_uk_resident
    type: boolean
    required: false
- name: draft_section_notice
  description: Generate a Section 21 or Section 8 notice template.
  parameters:
  - name: notice_type
    type: string
    required: true
  - name: landlord_name
    type: string
    required: true
  - name: tenant_name
    type: string
    required: true
  - name: property_address
    type: string
    required: true
  - name: tenancy_start_date
    type: string
    required: true
  - name: grounds
    type: array
    required: false
  - name: arrears_amount
    type: number
    required: false
- name: check_right_of_way
  description: Analyze a right of way or easement and explain its implications.
  parameters:
  - name: description
    type: string
    required: true
  - name: right_type
    type: string
    required: false
  - name: registered
    type: boolean
    required: false
